name: 每日更新台股資料

on:
  schedule:
    # UTC 時間 14:00 = 台灣時間(UTC+8) 22:00，同一個平日的晚上。
    # 此時當天的股價、三大法人、融資融券通常都已公布，抓到的就是「當天」資料。
    # 注意：GitHub 排程常有數十分鐘到數小時的延遲，實際開跑時間會比 22:00 晚一些。
    - cron: '0 14 * * 1-5'
  workflow_dispatch:  # 允許在 GitHub 網站上手動點擊執行，方便測試

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v6

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取最新股價與籌碼資料
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python fetch_taiwan50_to_raw.py

      - name: 轉換至 staging layer
        if: always()
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python transform_to_staging.py

      - name: 計算技術指標至 mart layer
        if: always()
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python calc_technical_indicators.py
        
      - name: Paper trading update
        continue-on-error: true
        run: python paper_trading.py run
